name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Manifests are valid and index.json is current
        run: node scripts/check.mjs --check
      - name: Tests (recorded responses only, no network, no credentials)
        run: node --test "tests/*.test.mjs" "connectors/*/test/*.test.mjs"
      - name: Verified registry is well formed
        run: node scripts/registry.mjs --check
  telegram:
    # Telegram's runtime (linked/telegram/tgcli, Go): vet, format and tests, no network to Telegram.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: linked/telegram/tgcli
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: linked/telegram/tgcli/go.mod
          cache-dependency-path: linked/telegram/tgcli/go.sum
      - name: Formatted
        run: test -z "$(gofmt -l .)"
      - name: Vet and tests
        run: go vet ./... && go test ./...
  review:
    # The automatic review (docs/review.md) of every connector a pull request adds or changes.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Review each changed connector (files, manifest, logo, contract, hosts, code, secrets, offline tests)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for id in $(git diff --name-only "$BASE...$HEAD" -- connectors/ | awk -F/ 'NF > 2 {print $2}' | sort -u); do
            [ -f "connectors/$id/connector.json" ] || continue
            echo "== $id"
            node scripts/review.mjs "connectors/$id" || status=1
          done
          exit $status
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Every commit is signed off (DCO)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=$(git log --format='%H %(trailers:key=Signed-off-by,valueonly,separator=%x2C)' "$BASE..$HEAD" | awk 'NF < 2 {print $1}')
          if [ -n "$missing" ]; then echo "Commits without Signed-off-by (use git commit -s):"; echo "$missing"; exit 1; fi
